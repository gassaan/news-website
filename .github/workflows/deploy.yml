name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # A Sanity webhook can trigger an instant rebuild when content is published.
  repository_dispatch:
    types: [sanity-publish]
  # Otherwise check the dashboard every 10 minutes and rebuild only if content changed.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The site's online service (api/): view counts, poll votes, story ratings and
  # comments. Runs only once the Cloudflare secrets are added; without them the site
  # builds exactly as before. The service is (re)deployed on pushes, not on the
  # 10-minute checks, which only need its address.
  api:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      # Optional, read-only: lets the dashboard show readers from Cloudflare Web Analytics.
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: url
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Online service not set up yet (no Cloudflare secrets): skipping."; exit 0
          fi
          SUB=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).result?.subdomain??"")}catch{console.log("")}})' || true)
          if [ -z "$SUB" ]; then
            echo "::warning::Open Workers & Pages in the Cloudflare dashboard once to choose a workers.dev name."; exit 0
          fi
          echo "url=https://hulhangu-api.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
      - if: steps.url.outputs.url != '' && github.event_name != 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # A failed service update must never stop the site itself from updating.
      - if: steps.url.outputs.url != '' && github.event_name != 'schedule'
        continue-on-error: true
        working-directory: api
        run: |
          npm ci
          # Security tests first (api/test): if any protection is broken, the service
          # isn't updated (the site still is).
          npm test
          # The database: created the first time, then its tables brought up to date.
          ID=$(npx wrangler d1 list --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log((JSON.parse(d).find(x=>x.name==="hulhangu")||{}).uuid||""))')
          if [ -z "$ID" ]; then
            npx wrangler d1 create hulhangu
            ID=$(npx wrangler d1 list --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log((JSON.parse(d).find(x=>x.name==="hulhangu")||{}).uuid||""))')
          fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          npx wrangler d1 migrations apply hulhangu --remote
          npx wrangler deploy
          # Comments are passed to the dashboard with this key (kept as a secret on the service).
          if [ -n "$SANITY_WRITE_TOKEN" ]; then printf '%s' "$SANITY_WRITE_TOKEN" | npx wrangler secret put SANITY_TOKEN; fi
          if [ -n "$CLOUDFLARE_ANALYTICS_TOKEN" ]; then
            printf '%s' "$CLOUDFLARE_ANALYTICS_TOKEN" | npx wrangler secret put CF_ANALYTICS_TOKEN
            printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CF_ACCOUNT_ID
          fi

  check:
    needs: api
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: compare
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PID=$(node -p "require('./src/sanity/project.json').projectId")
          DS=$(node -p "require('./src/sanity/project.json').dataset")
          if [ -z "$PID" ]; then
            echo "No Sanity project yet"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Same stamp format as scripts/fetch-cms.mjs writes to cms-stamp.txt.
          NEW=$(curl -fsS -G "https://$PID.apicdn.sanity.io/v2025-02-19/data/query/$DS" \
            --data-urlencode "perspective=published" \
            --data-urlencode 'query={"latest": *[_type != "comment"] | order(_updatedAt desc)[0]._updatedAt, "count": count(*[_type != "comment"]), "due": count(*[_type in ["article", "story"] && publishedAt <= now()])}' \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d).result;console.log(`${r.latest??""}|${r.count}|${r.due}`)})')
          # The week's most read, so the "most popular" list stays fresh (same rule as scripts/fetch-cms.mjs).
          API="${{ needs.api.outputs.url }}"
          if [ -n "$API" ]; then
            TOP=$(curl -fsS "$API/top?days=7&limit=8" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).map(t=>t.slug).join(","))}catch{console.log("")}})' || true)
            NEW="$NEW|$TOP"
          fi
          OLD=$(curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/cms-stamp.txt" || true)
          echo "dashboard: $NEW  site: $OLD"
          if [ "$NEW" != "$OLD" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: [api, check]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.api.outputs.url }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After the update is online: post newly published items that have the Facebook box ticked.
  facebook:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/post-facebook.mjs
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
